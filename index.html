<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Kolmar 2026 OpenLab 업무 자동화 영상 쇼케이스">
  <title>Kolmar 2026 OpenLab Showcase</title>
  <style>
    :root {
      color-scheme: light;
      --blue: #276ef1;
      --navy: #00005a;
      --ink: #182026;
      --muted: #68727d;
      --paper: #f3f6fa;
      --line: #dfe5ed;
      --white: #fff;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, video { font: inherit; }
    .deck { position: relative; width: 100%; height: 100%; }
    .slide {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: clamp(28px, 5vw, 84px);
      background: radial-gradient(circle at 82% 10%, #e2eaff 0, transparent 30%), linear-gradient(145deg, #fff 0%, var(--paper) 100%);
      opacity: 0;
      visibility: hidden;
      transform: translateX(4%);
      transition: opacity 260ms ease, transform 320ms ease, visibility 0s linear 320ms;
      pointer-events: none;
    }
    .slide.active {
      opacity: 1;
      visibility: visible;
      transform: translateX(0);
      transition-delay: 0s;
      pointer-events: auto;
    }
    .cover { width: min(1500px, 100%); }
    .eyebrow { margin: 0 0 16px; color: var(--blue); font-size: clamp(14px, 1.5vw, 22px); font-weight: 900; letter-spacing: .13em; }
    h1 { margin: 0; color: var(--navy); font-size: clamp(58px, 8vw, 128px); line-height: .96; letter-spacing: -.065em; }
    .intro { max-width: 920px; margin: 32px 0 0; color: var(--muted); font-size: clamp(20px, 2.2vw, 34px); line-height: 1.55; }
    .click-hint { margin-top: 64px; color: var(--blue); font-size: clamp(16px, 1.5vw, 22px); font-weight: 850; }
    .video-slide { padding: clamp(18px, 2.5vw, 42px); }
    .video-layout { width: min(1760px, 100%); height: 100%; display: grid; place-items: center; }
    .video-frame {
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: clamp(18px, 2vw, 30px);
      background: #eef2f7;
      box-shadow: 0 30px 80px rgba(0,0,60,.13);
    }
    video { display: block; width: 100%; height: 100%; object-fit: contain; background: #eef2f7; }
    .controls { position: fixed; right: 22px; bottom: 18px; z-index: 10; display: flex; align-items: center; gap: 8px; }
    .counter { min-width: 50px; color: var(--muted); font-size: 13px; text-align: center; }
    .nav-button {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(255,255,255,.9);
      color: var(--navy);
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,60,.08);
    }
    .nav-button:disabled { opacity: .3; cursor: default; }
    .nav-button:focus-visible, video:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
    @media (max-width: 760px) {
      .video-frame { border-radius: 15px; }
      .controls { right: 12px; bottom: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .slide { transition: none; }
    }
  </style>
</head>
<body>
  <main class="deck" id="deck">
    <section class="slide active" aria-label="표지">
      <div class="cover">
        <p class="eyebrow">2026 OPENLAB · AUTOMATION SHOWCASE</p>
        <h1>업무의 흐름을<br>눈앞에서 움직이게</h1>
        <p class="intro">팀별 자동화 과제를 짧은 모션 카드로 보여주는 공개 쇼케이스입니다.</p>
        <p class="click-hint">화면을 클릭해 시작</p>
      </div>
    </section>

    <section class="slide video-slide" aria-label="물류팀 1단계"><div class="video-layout"><div class="video-frame"><video muted playsinline preload="auto" poster="public/posters/03-logistics-phase-1.jpg"><source src="public/videos/03-logistics-phase-1.mp4" type="video/mp4"></video></div></div></section>
    <section class="slide video-slide" aria-label="물류팀 2단계"><div class="video-layout"><div class="video-frame"><video muted playsinline preload="auto" poster="public/posters/03-logistics-phase-2.jpg"><source src="public/videos/03-logistics-phase-2.mp4" type="video/mp4"></video></div></div></section>
    <section class="slide video-slide" aria-label="스케일업팀 1단계"><div class="video-layout"><div class="video-frame"><video muted playsinline preload="auto" poster="public/posters/06-scaleup-phase-1.jpg"><source src="public/videos/06-scaleup-phase-1.mp4" type="video/mp4"></video></div></div></section>
    <section class="slide video-slide" aria-label="스케일업팀 2단계"><div class="video-layout"><div class="video-frame"><video muted playsinline preload="auto" poster="public/posters/06-scaleup-phase-2.jpg"><source src="public/videos/06-scaleup-phase-2.mp4" type="video/mp4"></video></div></div></section>
    <section class="slide video-slide" aria-label="품질보증팀 1단계"><div class="video-layout"><div class="video-frame"><video muted playsinline preload="auto" poster="public/posters/08-quality-assurance-phase-1.jpg"><source src="public/videos/08-quality-assurance-phase-1.mp4" type="video/mp4"></video></div></div></section>
    <section class="slide video-slide" aria-label="품질보증팀 2단계"><div class="video-layout"><div class="video-frame"><video muted playsinline preload="auto" poster="public/posters/08-quality-assurance-phase-2.jpg"><source src="public/videos/08-quality-assurance-phase-2.mp4" type="video/mp4"></video></div></div></section>
    <section class="slide video-slide" aria-label="품질보증팀 3단계"><div class="video-layout"><div class="video-frame"><video muted playsinline preload="auto" poster="public/posters/08-quality-assurance-phase-3.jpg"><source src="public/videos/08-quality-assurance-phase-3.mp4" type="video/mp4"></video></div></div></section>
    <section class="slide video-slide" aria-label="품질관리2팀 1단계"><div class="video-layout"><div class="video-frame"><video muted playsinline preload="auto" poster="public/posters/11-analysis-list-phase-1.jpg"><source src="public/videos/11-analysis-list-phase-1.mp4" type="video/mp4"></video></div></div></section>
    <section class="slide video-slide" aria-label="품질관리2팀 2단계"><div class="video-layout"><div class="video-frame"><video muted playsinline preload="auto" poster="public/posters/11-analysis-list-phase-2.jpg"><source src="public/videos/11-analysis-list-phase-2.mp4" type="video/mp4"></video></div></div></section>
    <section class="slide video-slide" aria-label="품질관리4팀 재시험 1단계"><div class="video-layout"><div class="video-frame"><video muted playsinline preload="auto" poster="public/posters/19-microbe-retest-phase-1.jpg"><source src="public/videos/19-microbe-retest-phase-1.mp4" type="video/mp4"></video></div></div></section>
    <section class="slide video-slide" aria-label="품질관리4팀 재시험 2단계"><div class="video-layout"><div class="video-frame"><video muted playsinline preload="auto" poster="public/posters/19-microbe-retest-phase-2.jpg"><source src="public/videos/19-microbe-retest-phase-2.mp4" type="video/mp4"></video></div></div></section>
    <section class="slide video-slide" aria-label="품질관리4팀 재시험 3단계"><div class="video-layout"><div class="video-frame"><video muted playsinline preload="auto" poster="public/posters/19-microbe-retest-phase-3.jpg"><source src="public/videos/19-microbe-retest-phase-3.mp4" type="video/mp4"></video></div></div></section>
    <section class="slide video-slide" aria-label="품질관리4팀 미생물 자동화 1단계"><div class="video-layout"><div class="video-frame"><video muted playsinline preload="auto" poster="public/posters/20-microbe-automation-phase-1.jpg"><source src="public/videos/20-microbe-automation-phase-1.mp4" type="video/mp4"></video></div></div></section>
    <section class="slide video-slide" aria-label="품질관리4팀 미생물 자동화 2단계"><div class="video-layout"><div class="video-frame"><video muted playsinline preload="auto" poster="public/posters/20-microbe-automation-phase-2.jpg"><source src="public/videos/20-microbe-automation-phase-2.mp4" type="video/mp4"></video></div></div></section>
    <section class="slide video-slide" aria-label="품질관리4팀 미생물 자동화 3단계"><div class="video-layout"><div class="video-frame"><video muted playsinline preload="auto" poster="public/posters/20-microbe-automation-phase-3.jpg"><source src="public/videos/20-microbe-automation-phase-3.mp4" type="video/mp4"></video></div></div></section>

    <section class="slide" aria-label="마침">
      <div class="cover">
        <p class="eyebrow">2026 OPENLAB · KOLMAR</p>
        <h1>업무 자동화의<br>다음 장면으로</h1>
        <p class="intro">6개 팀별 과제를 15개의 단계별 모션으로 살펴봤습니다.</p>
      </div>
    </section>
  </main>

  <nav class="controls" aria-label="슬라이드 이동">
    <button class="nav-button" id="previous" type="button" aria-label="이전 슬라이드">←</button>
    <span class="counter" id="counter" aria-live="polite">1 / 17</span>
    <button class="nav-button" id="next" type="button" aria-label="다음 슬라이드">→</button>
  </nav>

  <script>
    const slides = [...document.querySelectorAll('.slide')];
    const videos = [...document.querySelectorAll('video')];
    const previousButton = document.querySelector('#previous');
    const nextButton = document.querySelector('#next');
    const counter = document.querySelector('#counter');
    const deck = document.querySelector('#deck');
    let currentSlide = 0;

    const showSlide = (index) => {
      const nextIndex = Math.max(0, Math.min(index, slides.length - 1));
      currentSlide = nextIndex;

      slides.forEach((slide, slideIndex) => {
        const isActive = slideIndex === currentSlide;
        slide.classList.toggle('active', isActive);
        slide.setAttribute('aria-hidden', String(!isActive));
      });

      videos.forEach((video) => {
        const isActive = video.closest('.slide').classList.contains('active');
        if (isActive) {
          video.currentTime = 0;
          video.play().catch(() => {});
        } else {
          video.pause();
          video.currentTime = 0;
        }
      });

      previousButton.disabled = currentSlide === 0;
      nextButton.disabled = currentSlide === slides.length - 1;
      counter.textContent = `${currentSlide + 1} / ${slides.length}`;
      history.replaceState(null, '', `#${currentSlide + 1}`);
    };

    const nextSlide = () => showSlide(currentSlide + 1);
    const previousSlide = () => showSlide(currentSlide - 1);

    deck.addEventListener('click', (event) => {
      if (event.target.closest('video, button, a')) return;
      nextSlide();
    });
    nextButton.addEventListener('click', nextSlide);
    previousButton.addEventListener('click', previousSlide);
    document.addEventListener('keydown', (event) => {
      if (['ArrowRight', 'PageDown', 'Enter', ' '].includes(event.key)) {
        event.preventDefault();
        nextSlide();
      }
      if (['ArrowLeft', 'PageUp', 'Backspace'].includes(event.key)) {
        event.preventDefault();
        previousSlide();
      }
    });

    const hashIndex = Number.parseInt(location.hash.slice(1), 10) - 1;
    showSlide(Number.isNaN(hashIndex) ? 0 : hashIndex);
  </script>
</body>
</html>
